# SPDX-License-Identifier: GPL-2.0-or-later
# A candidate release of the plugin from a plugin-YYYY.MM.DD tag (REQ-PKG-16, REQ-PKG-19,
# REQ-PKG-23, REQ-PKG-24): the package, built reproducibly, and a .plg file with the version of
# the tag and the hash of that package, as a GitHub pre-release. The .plg file on main moves to
# that version only when a person promotes the candidate (promote-plugin.yml).
name: release-plugin

on:
  push:
    tags: ['plugin-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the package and the .plg file of the candidate
        run: |
          version=${GITHUB_REF_NAME#plugin-}
          plg=sources/plugin/tofuman.plg
          grep -q "^### $version\$" $plg || { echo "the CHANGES of tofuman.plg have no heading for $version (REQ-PKG-24)"; exit 1; }
          set -- $(sh sources/plugin/ci/package.sh "$version" --plg)
          echo "PACKAGE=$1" >> "$GITHUB_ENV"
      - name: Publish the candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#plugin-}
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$GITHUB_REF_NAME/tofuman.plg"
          notes="Candidate release. Install it in the webgui (Plugins, Install Plugin) from $url, run the end-to-end procedure of docs/SPEC.md section 18, and promote it by committing this tofuman.plg to sources/plugin/ on main."
          gh release create "$GITHUB_REF_NAME" --prerelease --title "tofuman plugin $version (candidate)" --notes "$notes" "$PACKAGE" sources/plugin/tofuman.plg
