# SPDX-License-Identifier: GPL-2.0-or-later
# A plugin release from a plugin-YYYY.MM.DD tag (REQ-PKG-16, REQ-PKG-19, REQ-PKG-20). The tagged
# commit carries tofuman.plg with the version and the hash that ci/package.sh --plg wrote; this
# workflow builds the package again and publishes it only if the hash matches.
name: release-plugin

on:
  push:
    tags: ['plugin-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the package and check it against tofuman.plg
        run: |
          version=${GITHUB_REF_NAME#plugin-}
          plg=sources/plugin/tofuman.plg
          [ "$(sed -n 's|<!ENTITY version "\([^"]*\)">|\1|p' $plg)" = "$version" ] || { echo "tofuman.plg is not at version $version"; exit 1; }
          set -- $(sh sources/plugin/ci/package.sh "$version")
          expected=$(sed -n 's|<!ENTITY sha256 "\([0-9a-f]*\)">|\1|p' $plg)
          [ "$2" = "$expected" ] || { echo "the package hashes to $2, and tofuman.plg expects $expected"; exit 1; }
          echo "PACKAGE=$1" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "tofuman plugin ${GITHUB_REF_NAME#plugin-}" --notes "Install or update from sources/plugin/tofuman.plg on main." "$PACKAGE" sources/plugin/tofuman.plg
